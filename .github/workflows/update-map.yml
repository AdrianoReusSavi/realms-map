name: Update Map

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-map
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore auth cache
        uses: actions/cache@v4
        id: auth-cache
        with:
          path: auth-cache
          key: auth-cache-${{ github.run_id }}
          restore-keys: auth-cache-

      - name: Bootstrap auth from secret
        if: steps.auth-cache.outputs.cache-hit != 'true'
        env:
          AUTH_CACHE: ${{ secrets.AUTH_CACHE }}
        run: |
          mkdir -p auth-cache
          node -e "
            const fs = require('fs');
            const data = JSON.parse(Buffer.from(process.env.AUTH_CACHE, 'base64').toString());
            for (const [file, content] of Object.entries(data)) {
              fs.writeFileSync('auth-cache/' + file, content);
            }
          "

      - name: Restore previous render
        uses: actions/cache@v4
        with:
          path: output
          key: render-v5-${{ github.run_id }}
          restore-keys: render-v5-

      - name: Download and render
        env:
          REALM_ID: ${{ secrets.REALM_ID }}
          AUTH_CACHE_PATH: ./auth-cache
          BACKUP_PATH: ./backups
          OUTPUT_PATH: ./output
        run: npm run update

      - name: Copy favicon
        run: cp public/favicon.png output/favicon.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4